<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090a">
  <meta name="description" content="Cardápio digital da Miranda Empório de Bebidas">
  <title>Miranda Empório de Bebidas</title>
  <link rel="icon" href="./assets/img/logo-miranda.webp">
  <link rel="stylesheet" href="./css/global.css?v=8">
  <link rel="stylesheet" href="./css/cliente.css?v=8">
</head>
<body>
<header class="client-header" id="client-header">
  <div class="topbar">
    <a class="brand" href="./" aria-label="Miranda Empório de Bebidas">
      <img class="brand-logo" src="./assets/img/logo-miranda.webp" alt="Logo Miranda Empório de Bebidas">
      <div class="brand-copy">
        <p class="eyebrow">Miranda</p>
        <h1>Empório de Bebidas</h1>
      </div>
    </a>
    <span id="mesa-badge" class="status-pill">Validando mesa</span>
  </div>
</header>

<main class="container">

  <section id="setup-alert" class="notice hidden"></section>

  <section id="identificacao" class="card identificacao">
    <div class="identification-grid">
      <div class="account-summary">
        <div class="account-icon">⌁</div>
        <div>
          <h3 id="titulo-conta">Identificando a conta...</h3>
          <p id="texto-conta" class="muted">Aguarde alguns instantes.</p>
        </div>
      </div>
      <form id="form-nome" class="form-grid hidden">
        <label>
          Como podemos chamar você?
          <input id="nome" maxlength="40" autocomplete="name" placeholder="Ex.: Renan" required>
        </label>
        <button class="btn btn-primary" type="submit">Entrar nesta mesa</button>
      </form>
    </div>
  </section>

  <section id="area-cardapio" class="hidden page-enter">
    <div class="catalog-header">
      <div>
        <h2>Cardápio</h2>
      </div>
      <div class="catalog-actions">
        <button id="meus-pedidos" class="btn btn-secondary" type="button">Meus pedidos</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <input id="busca" placeholder="Buscar cerveja, porção, espetinho..." aria-label="Buscar produto">
      </div>
      <button id="limpar-busca" class="btn btn-secondary hidden" type="button">Limpar busca</button>
    </div>

    <div id="categorias" class="categories" aria-label="Categorias"></div>
    <div id="catalogo-loading" class="catalog-skeleton" aria-label="Carregando cardápio">
      <article class="product-skeleton card skeleton"><div class="sk-img"></div><div class="sk-body"><div class="skeleton-line wide"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></article>
      <article class="product-skeleton card skeleton"><div class="sk-img"></div><div class="sk-body"><div class="skeleton-line wide"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></article>
      <article class="product-skeleton card skeleton"><div class="sk-img"></div><div class="sk-body"><div class="skeleton-line wide"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></article>
      <article class="product-skeleton card skeleton"><div class="sk-img"></div><div class="sk-body"><div class="skeleton-line wide"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></article>
    </div>
    <div id="produtos" class="products hidden"></div>
  </section>
</main>

<button id="abrir-carrinho" class="btn btn-primary cart-fab hidden" type="button">
  <span>Ver carrinho</span><span id="qtd-carrinho" class="cart-count">0</span>
</button>

<div id="modal-carrinho" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="titulo-carrinho">
  <section class="modal card">
    <div class="row-between">
      <div><h2 id="titulo-carrinho">Carrinho</h2></div>
      <button data-fechar class="btn btn-secondary btn-icon" type="button" aria-label="Fechar">×</button>
    </div>
    <div id="itens-carrinho" class="cart-items"></div>
    <label>Observações do pedido
      <textarea id="observacao" rows="3" maxlength="240" placeholder="Ex.: sem cebola, bebida bem gelada..."></textarea>
    </label>
    <div class="row-between cart-total"><strong>Total do pedido</strong><strong id="total-carrinho">R$ 0,00</strong></div>
    <button id="enviar-pedido" class="btn btn-primary" type="button">Enviar pedido</button>
    <p id="erro-pedido" class="error"></p>
  </section>
</div>

<div id="modal-pedidos" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="titulo-pedidos">
  <section class="modal card">
    <div class="row-between">
      <div><h2 id="titulo-pedidos">Pedidos da mesa</h2></div>
      <button data-fechar class="btn btn-secondary btn-icon" type="button" aria-label="Fechar">×</button>
    </div>
    <div id="lista-meus-pedidos" class="status-list"></div>
  </section>
</div>

<script type="module" src="./js/cliente/app.js?v=8"></script>
</body>
</html>
