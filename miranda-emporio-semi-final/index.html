<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#9f1118">
  <title>Miranda Empório de Bebidas</title>
  <link rel="stylesheet" href="./css/global.css"><link rel="stylesheet" href="./css/cliente.css">
</head>
<body>
<header class="topbar">
  <div class="logo-title"><p class="eyebrow">MIRANDA</p><h1>Empório de Bebidas</h1></div>
  <span id="mesa-badge" class="badge">Validando mesa...</span>
</header>
<main class="container">
  <section class="hero card">
    <p class="eyebrow">CARDÁPIO DIGITAL</p>
    <h2>Seu pedido direto da mesa.</h2>
    <p>Bebidas, espetinhos e porções. O pagamento é feito somente ao fechar a conta no caixa.</p>
  </section>

  <section id="setup-alert" class="notice hidden"></section>

  <section id="identificacao" class="card identificacao">
    <h3 id="titulo-conta">Identificando a conta...</h3>
    <p id="texto-conta" class="muted">Aguarde.</p>
    <form id="form-nome" class="form-grid hidden">
      <label>Seu nome<input id="nome" maxlength="40" autocomplete="name" required></label>
      <button class="btn btn-primary" type="submit">Entrar nesta mesa</button>
    </form>
  </section>

  <section id="area-cardapio" class="hidden">
    <div class="toolbar">
      <input id="busca" placeholder="Buscar produto...">
      <button id="meus-pedidos" class="btn btn-secondary">Meus pedidos</button>
    </div>
    <div id="categorias" class="categories"></div>
    <div id="produtos" class="products"></div>
  </section>
</main>

<button id="abrir-carrinho" class="btn btn-primary cart-fab hidden">Carrinho (<span id="qtd-carrinho">0</span>)</button>

<div id="modal-carrinho" class="modal-backdrop hidden">
  <section class="modal card">
    <div class="row-between"><h2>Carrinho</h2><button data-fechar class="btn btn-secondary">Fechar</button></div>
    <div id="itens-carrinho" class="cart-items"></div>
    <label>Observações do pedido<textarea id="observacao" rows="3" maxlength="240" placeholder="Ex.: sem cebola, bebida bem gelada..."></textarea></label>
    <div class="row-between"><strong>Total</strong><strong id="total-carrinho">R$ 0,00</strong></div>
    <button id="enviar-pedido" class="btn btn-primary">Enviar pedido</button>
    <p id="erro-pedido" class="error"></p>
  </section>
</div>

<div id="modal-pedidos" class="modal-backdrop hidden">
  <section class="modal card">
    <div class="row-between"><h2>Meus pedidos</h2><button data-fechar class="btn btn-secondary">Fechar</button></div>
    <div id="lista-meus-pedidos" class="status-list"></div>
  </section>
</div>

<script type="module" src="./js/cliente/app.js"></script>
</body>
</html>
